baseURL: "https://gacebmohammedseghir17.github.io/"
title: "Mohammed Seghir GACEB"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
          inline:
            - - '$'
              - '$'
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: false
    style: monokai

params:
  env: production
  math: true
  title: "Mohammed Seghir GACEB"
  description: "Cybersecurity Master's Student documenting enterprise lab architectures, detection engineering, threat analysis, and security automation."
  keywords: [Cybersecurity, Network Engineering, SOC, SIEM, NetSim, Cisco Packet Tracer, QoS]
  author: "Mohammed Seghir GACEB"

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true

