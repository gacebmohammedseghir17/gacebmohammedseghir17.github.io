baseURL: "https://gacebmohammedseghir17.github.io/"
title: "Mohammed Seghir GACEB"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
          inline:
            - - '$'
              - '$'
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: false
    style: monokai

params:
  env: production
  math: true
  title: "Mohammed Seghir GACEB"
  description: "Cybersecurity MSc student building detection, network, and security automation labs with a portfolio of hands-on write-ups and case studies."
  keywords: [Cybersecurity, Detection Engineering, Security Automation, Network Engineering, SOC, SIEM, NetSim, Cisco Packet Tracer]
  author: "Mohammed Seghir GACEB"
  mainSections: ["posts"]

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"

  homeInfoParams:
    Eyebrow: "Cybersecurity Portfolio"
    Title: "Cybersecurity MSc Student Building Detection, Network, and Security Automation Labs"
    Content: "I document hands-on cybersecurity labs, network simulations, detection ideas, and security automation work while building toward a security engineering career."
    PrimaryButton:
      name: "View Projects"
      url: "/projects/"
    SecondaryButton:
      name: "Read Write-ups"
      url: "/posts/"

  featuredItems:
    - title: "Network Performance Metrics & Simulation Analysis"
      summary: "A comparative case study on latency, throughput, jitter, and engineering trade-offs between NetSim and Cisco Packet Tracer."
      url: "/posts/network-performance-netsim-vs-packet-tracer/"
      label: "Featured Case Study"
    - title: "Detection Engineering Track"
      summary: "A growing body of work focused on telemetry quality, alert logic, and security operations thinking."
      url: "/projects/#detection-engineering"
      label: "Current Focus"
    - title: "Security Automation Track"
      summary: "Portfolio work around repeatable labs, documentation systems, and automation-driven workflows."
      url: "/projects/#security-automation"
      label: "Current Focus"

  focusAreas:
    - title: "Detection Engineering"
      description: "Building practical ideas around telemetry, signal quality, and detection logic."
    - title: "Network Engineering"
      description: "Using labs and simulation to explain latency, throughput, architecture, and operational behavior."
    - title: "Security Automation"
      description: "Turning repetitive security and documentation tasks into clear, reusable workflows."

  trustRow:
    label: "Academic & Technical Environment"
    items:
      - name: "Asia Pacific University"
        logo: "/logos/apu.png"
      - name: "De Montfort University"
        logo: "/logos/dmu.png"
      - name: "Cisco"
        logo: "/logos/cisco.svg"
      - name: "AWS"
        logo: "/logos/aws.svg"

  socialIcons:
    - name: "github"
      url: "https://github.com/gacebmohammedseghir17"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/gaceb-mohammed-seghir-828236243"
    - name: "email"
      url: "mailto:gaceb.mohammed.seghir@gmail.com"

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: posts
      name: Write-ups
      url: /posts/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: resume
      name: Resume
      url: /resume/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
