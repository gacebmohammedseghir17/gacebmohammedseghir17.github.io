baseURL: "https://gacebmohammedseghir17.github.io/"
title: "Mohammed Seghir GACEB | CyberSec Engineering"
theme: "PaperMod"

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowToc: true
  ShowPostNavLinks: true

  homeInfoParams:
    Title: "Hi, I'm Mohammed Seghir GACEB 👋"
    Content: "Asia Pacific University of Technology and Innovation & De Montfort University of Leicester Master of Cyber Security Student documenting enterprise labs, detection engineering, threat analysis, and security automation."

  socialIcons:
    - name: "github"
      url: "https://github.com/gacebmohammedseghir17"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/gaceb-mohammed-seghir-828236243"
    - name: "email"
      url: "mailto:gaceb.mohammed.seghir@gmail.com"

menu:
  main:
    - identifier: posts
      name: Labs & Write-ups
      url: /posts/
      weight: 10
    - identifier: search
      name: Search
      url: /search/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
